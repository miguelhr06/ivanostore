<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>IvanoStore | Checkout</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://checkout.culqi.com/js/v4" async></script>
  <script>
  function culqi() {
    if (Culqi.token) {
      // Disparamos un evento que Angular escuchará en PagoComponent
      window.dispatchEvent(new CustomEvent('culqi-pago-exitoso', { 
        detail: { token: Culqi.token.id, email: Culqi.token.email } 
      }));
      Culqi.close();
    } else {
      console.log("Error Culqi:", Culqi.error);
    }
  }
</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <app-root></app-root>
</body>
</html>
