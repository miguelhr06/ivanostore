<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>IvanoStore | Checkout</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

<script src="https://checkout.culqi.com/js/v4"></script>
<script>
  window.addEventListener('message', function(event) {
    if (event.origin === 'https://checkout.culqi.com') {
      const { eventType, data } = event.data;
      
      if (eventType === 'token_created') {
        console.log('Token generado exitosamente:', data.id);
        
        // ¡IMPORTANTE! Envía este token a tu backend para terminar el cargo
        // Cuando tu backend responda "OK", puedes cerrar el modal así:
        window.Culqi.close(); 
        alert('Pago procesado correctamente');
      } 
      else if (eventType === 'error') {
        console.error('Error reportado:', data);
      }
    }
  });
</script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

</body>
</html>
