<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>IvanoStore | Checkout</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

<script src="https://checkout.culqi.com/js/v4"></script>
<script>
  window.addEventListener('message', function(event) {
    if (event.origin === 'https://checkout.culqi.com') {
      const { eventType, data } = event.data;
      
      if (eventType === 'token_created') {
        // AQUÍ ESTÁ EL CAMBIO:
        console.log('Token creado:', data.id);
        
        // 1. Cierra el modal manualmente si es necesario
        // 2. ENVÍA EL TOKEN A TU BACKEND PARA FINALIZAR EL PAGO
        // Debes llamar a tu servicio de carrito o backend aquí:
        alert('Pago exitoso, token: ' + data.id);
        
        // Ejemplo de lo que deberías hacer:
        // fetch('TU_URL_DE_BACKEND/procesar-pago', { 
        //    method: 'POST', 
        //    body: JSON.stringify({ token: data.id }) 
        // });
      } 
      else if (eventType === 'error') {
        console.error('Error reportado por Culqi:', data);
        alert('Error: ' + data.user_message);
      }
    }
  });
</script>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>

</body>
</html>
